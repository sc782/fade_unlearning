name: unlearn_canvas
channels:
  - pytorch
  - defaults
dependencies:
  - python=3.8.5
  - pip=20.3
  - cudatoolkit=11.3
  - pytorch=1.11.0
  - torchvision=0.12.0
  - numpy=1.19.2
  - pip:
    - albumentations==0.4.3
    - datasets==2.8.0
    - diffusers
    - opencv-python==4.1.2.30
    - pudb==2019.2
    - invisible-watermark
    - imageio==2.9.0
    - imageio-ffmpeg==0.4.2
    - pytorch-lightning==1.4.2
    - omegaconf==2.1.1
    - test-tube>=0.7.5
    - streamlit>=0.73.1
    - einops==0.3.0
    - torch-fidelity==0.3.0
    - transformers==4.36.0
    - torchmetrics==0.6.0
    - kornia==0.6
    - taming-transformers-rom1504
    - clip
    - -e git+https://github.com/CompVis/taming-transformers.git@master#egg=taming-transformers
    - -e git+https://github.com/openai/CLIP.git@main#egg=clip
    - git+https://github.com/crowsonkb/k-diffusion.git
    - natsort # imported by the (unused-by-FADE) vendored ldm/models/diffusion/classifier.py
    - timm>=0.9 # evaluation/classification.py uses timm's newer model.tag pretrained-weight naming
    - huggingface_hub # scripts/download_checkpoints.py
    - safetensors # scripts/download_checkpoints.py
    - scipy # evaluation/fid.py
    - torchdiffeq # edm_sampler/sampling.py (used by exp_qualitative_eval.py, sample_single.py)
    - torchsde # edm_sampler/sampling.py (used by exp_qualitative_eval.py, sample_single.py)
    - wandb # machine_unlearning/mu_{concept_ablation_ca,erase_diff_ediff,erasing_concept_esd} training scripts
    - accelerate # diffuser_sd_training.py (optional diffuser-format training path)
    - quadprog # machine_unlearning/mu_scissorhands_shs/train-erase.py
    # bitsandbytes and xformers are optional (gated behind --use_8bit_adam /
    # --enable_xformers_memory_efficient_attention in diffuser_sd_training.py, with a
    # clear error message if missing) -- install separately only if you need those flags.
